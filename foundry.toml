[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
test = "test"
gas_reports = ["MyAIEscrow", "MyAIReputation", "MyAIGovernance"]

# Reasonable defaults for CI fuzz/invariant
[fuzz]
runs = 1000
max_test_rejects = 65536

[invariant]
runs = 256
depth = 50
fail_on_revert = false
call_override = false
shrink_run_limit = 5000

# Long-form CI target: 10M fuzz runs (used by `forge test --profile heavy --fuzz-runs 10000000`)
[profile.heavy.fuzz]
runs = 10000000

[profile.heavy.invariant]
runs = 4096
depth = 200
fail_on_revert = false

# A 1M-run middle profile for the initial pass we actually executed
[profile.medium.fuzz]
runs = 1000000

[profile.medium.invariant]
runs = 1024
depth = 100
fail_on_revert = false

[rpc_endpoints]
base = "${BASE_RPC_URL}"

[etherscan]
base = { key = "${BASESCAN_API_KEY}", chain = 8453 }
